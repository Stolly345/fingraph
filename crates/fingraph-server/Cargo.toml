[package]
name = "fingraph-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FinGraph server: holds the ledger and the statements for the desktop and phone apps"
publish = false

[dependencies]
fingraph-core = { path = "../fingraph-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust_decimal = "1"
sha2 = "0.11"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
