# Builds the FinGraph Server image for amd64 and arm64 (a Raspberry Pi 4/5 runs it too) and publishes
# it on GitHub's container registry as ghcr.io/stolly345/fingraph-server:<version> and :latest.
#
# Runs when a release is published, or by hand (Actions → Server image → Run workflow) with a tag.

name: Server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (v0.3.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Version
        id: v
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/fingraph-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name fg -e FINGRAPH_ADDRESS=127.0.0.1:8743 -p 8743:8743 "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}"
          for i in $(seq 1 30); do curl -fsk https://127.0.0.1:8743/api/v1/info && break; sleep 2; done
          docker logs fg | grep -q "Pairing code"
          docker exec fg fingraph-server pair | grep -q "Pairing code"
